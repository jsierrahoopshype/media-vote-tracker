<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile — Media Vote Tracker | HoopsMatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-hover:#f0f0f2;--border:#d1d1d6;
  --text:#1d1d1f;--text-secondary:#6e6e73;--accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);
  --green:#1d8a40;--green-bar:#34c759;--red:#d12c2c;--red-bar:#ef4444;--orange:#b26b00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased}
.container{max-width:1100px;margin:0 auto;padding:1.5rem 1.5rem 4rem}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.back{font-size:.78rem;font-family:'JetBrains Mono',monospace;color:var(--text-secondary);display:inline-block;margin-bottom:1rem}
.back:hover{color:var(--accent);text-decoration:none}

.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;
  border-bottom:1px solid var(--border);padding-bottom:1rem;margin-bottom:1.2rem}
.phead h1{font-size:1.7rem;font-weight:700;letter-spacing:-.03em}
.phead .team{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--text-secondary);margin-top:.15rem}
.statline{display:flex;gap:1.6rem;flex-wrap:wrap;font-family:'JetBrains Mono',monospace}
.statline .stat{text-align:right}
.statline .num{font-size:1.3rem;font-weight:600}
.statline .lbl{font-size:.6rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.06em}

.section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.1rem 1.2rem;margin-bottom:1.1rem}
.section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600;margin-bottom:.2rem}
.section .hint{font-size:.74rem;color:var(--text-secondary);margin-bottom:.9rem}

/* career arc */
.arc-block{margin-bottom:1.1rem}
.arc-award{font-size:1rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.5rem}
.arc-rows{display:flex;flex-direction:column;gap:.3rem}
.arc-row{display:grid;grid-template-columns:4.5rem 1fr 3rem;align-items:center;gap:.6rem;font-size:.82rem}
.arc-row .yr{font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--text-secondary)}
.arc-track{position:relative;height:1.3rem;background:var(--surface-hover);border-radius:4px;overflow:hidden}
.arc-fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),#60a5fa)}
.arc-pct{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;text-align:right}

/* diverging board (matches reporter page) */
.toggle{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.toggle button{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:500;padding:.32rem .6rem;
  border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-secondary);cursor:pointer;transition:.12s}
.toggle button:hover{border-color:var(--accent);color:var(--accent)}
.toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.board{display:flex;flex-direction:column;gap:.18rem}
.row{display:grid;grid-template-columns:13rem 1fr 4.5rem;align-items:center;gap:.6rem;padding:.12rem 0;font-size:.84rem}
.row .pl{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pl a{font-weight:500;color:var(--text)}
.row .barwrap{position:relative;height:1.4rem;background:linear-gradient(90deg,transparent 49.7%,var(--border) 49.7%,var(--border) 50.3%,transparent 50.3%)}
.row .bar{position:absolute;top:.25rem;height:.9rem;border-radius:3px}
.row .bar.pos{left:50%;background:var(--green-bar)}
.row .bar.neg{right:50%;background:var(--red-bar)}
.row .val{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:600;text-align:left}
.row .val.pos{color:var(--green)}.row .val.neg{color:var(--red)}
.row .val .sub{display:block;font-size:.6rem;color:var(--text-secondary);font-weight:400}
.showmore{margin-top:.8rem;font-size:.74rem;font-family:'JetBrains Mono',monospace;background:none;border:none;color:var(--accent);cursor:pointer}
.showmore:hover{text-decoration:underline}
.foot{text-align:center;font-size:.72rem;color:var(--text-secondary);margin-top:1.4rem;font-family:'JetBrains Mono',monospace;line-height:1.7}
.row .pl .ol{display:block;font-size:.64rem;color:var(--text-secondary);margin-top:.05rem}
.row .pl .ol a{color:var(--text-secondary)}
.row .pl .ol a:hover{color:var(--accent)}

/* per-season grid */
.grid-award{margin-bottom:1.4rem}
.grid-award-h{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.6rem;
  padding-bottom:.35rem;border-bottom:2px solid var(--text)}
.grid-season{margin-bottom:.9rem}
.grid-season-h{font-family:'JetBrains Mono',monospace;font-size:.9rem;font-weight:700;margin-bottom:.4rem}
.grid-season-h .ct{font-weight:400;font-size:.66rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em}
.grid-cols{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:600px){.grid-cols{grid-template-columns:1fr}}
.gc-lbl{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:.35rem}
.gc-lbl.up{color:var(--green)}.gc-lbl.dn{color:var(--red)}
.grid-chip{display:flex;align-items:baseline;gap:.4rem;font-size:.8rem;padding:.22rem .5rem;
  border-radius:6px;margin-bottom:.18rem}
.grid-chip.up{background:var(--green-dim)}.grid-chip.dn{background:var(--red-dim)}
.grid-chip a{font-weight:500;color:var(--text)}
.grid-chip .chip-ol{font-size:.64rem;color:var(--text-secondary);flex:1}
.grid-chip b{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.74rem}
.grid-chip.up b{color:var(--green)}.grid-chip.dn b{color:var(--red)}
.grid-col .none{color:var(--text-secondary);font-size:.8rem}
@media(max-width:560px){.row{grid-template-columns:9rem 1fr 4rem}}
</style>
</head>
<body>
<div class="container">
  <a class="back" href="index.html">← All reporters</a>
  <div id="app"></div>
  <div class="foot">
    Support = each voter's points for this player minus what the rest of that season's panel averaged, summed across shared ballots.<br>
    Career arc shows % of the maximum possible points this player could have received each season (every voter's top vote).
  </div>
</div>

<script>
const AWARD_FULL = {"MVP": "MVP", "DPOY": "Defensive POY", "MIP": "Most Improved", "SMOY": "Sixth Man", "COY": "Coach", "ROY": "Rookie", "CPOY": "Clutch", "ALL_NBA": "All-NBA", "ALL_DEF": "All-Defensive", "ALL_ROOKIE": "All-Rookie"};
const ARC_ORDER = ["MVP", "ALL_NBA", "DPOY", "ALL_DEF", "CPOY", "MIP", "SMOY", "ROY", "ALL_ROOKIE", "COY"];
let DATA=null, curAward='ALL', expanded=false;

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function outletSlug(o){return o.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-+|-+$/g,'').toLowerCase();}

function load(){
  const slug=new URLSearchParams(location.search).get('p');
  if(!slug){ document.getElementById('app').innerHTML='<p style="color:var(--text-secondary)">No player specified. <a href="index.html">Back to directory.</a></p>'; return; }
  fetch(`./data/player/${slug}.json`).then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(d=>{DATA=d;render();})
    .catch(()=>{document.getElementById('app').innerHTML='<p style="color:var(--text-secondary)">Player not found. <a href="index.html">Back to directory.</a></p>';});
}

function render(){
  const d=DATA;
  // which awards have arc data, in prestige order
  const arcAwards=ARC_ORDER.filter(a=>d.arc && d.arc[a]);
  let html=`
  <div class="phead">
    <div><h1>${esc(d.player)}</h1></div>
    <div class="statline">
      <div class="stat"><div class="num">${d.total_pts.toLocaleString()}</div><div class="lbl">Career vote pts</div></div>
      <div class="stat"><div class="num">${d.board.length}</div><div class="lbl">Voters faced</div></div>
    </div>
  </div>`;

  // supporters / snubbers board (now FIRST)
  html+=`<div class="section">
    <h2>Biggest boosters & snubbers</h2>
    <div class="hint">Voters who rated ${esc(d.player)} furthest above (green) or below (red) the rest of the panel. Toggle by award.</div>
    <div class="toggle" id="toggle"></div>
    <div class="board" id="board"></div>
    <button class="showmore" id="showmore"></button>
  </div>`;

  // career arc (now SECOND)
  if(arcAwards.length){
    html+=`<div class="section"><h2>Career arc</h2>
      <div class="hint">Share of the maximum possible points each season (100% = every voter's top vote). Shows how support rose and fell.</div>`;
    arcAwards.forEach(a=>{
      const seasons=Object.keys(d.arc[a]).sort();
      html+=`<div class="arc-block"><div class="arc-award">${esc(AWARD_FULL[a]||a)}</div><div class="arc-rows">`;
      seasons.forEach(s=>{
        const v=d.arc[a][s];
        html+=`<div class="arc-row"><span class="yr">${esc(s)}</span>`+
          `<div class="arc-track"><div class="arc-fill" style="width:${v.pct}%"></div></div>`+
          `<span class="arc-pct">${v.pct}%</span></div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div>`;
  }

  // per-season grid: who championed / snubbed him each season (THIRD)
  if(d.grid && Object.keys(d.grid).length){
    html+=`<div class="section"><h2>Season by season</h2>
      <div class="hint">For each award and season, the voters who rated ${esc(d.player)} above (green) or below (red) the panel average that year. Click a name for their profile.</div>
      <div id="grid"></div></div>`;
  }

  document.getElementById('app').innerHTML=html;

  // build award toggle from awards present in board's by_award... board has no by_award here,
  // so derive toggles from arc awards + ALL
  const toggleEl=document.getElementById('toggle');
  const awards=['ALL'].concat(arcAwards);
  toggleEl.innerHTML=awards.map(a=>`<button data-a="${a}" class="${a===curAward?'active':''}">${a==='ALL'?'All awards':(AWARD_FULL[a]||a)}</button>`).join('');
  toggleEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{curAward=b.dataset.a;expanded=false;
    toggleEl.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.a===curAward));
    renderBoard();});
  renderBoard();
  renderGrid();
}

const ARC_ORDER_GRID=ARC_ORDER;
function renderGrid(){
  const el=document.getElementById('grid'); if(!el||!DATA.grid) return;
  const awards=ARC_ORDER.filter(a=>DATA.grid[a] && Object.keys(DATA.grid[a]).length);
  let html='';
  awards.forEach(a=>{
    const seasons=Object.keys(DATA.grid[a]).sort().reverse();  // newest first
    html+=`<div class="grid-award"><div class="grid-award-h">${esc(AWARD_FULL[a]||a)}</div>`;
    seasons.forEach(s=>{
      const g=DATA.grid[a][s];
      const champs=g.champions||[], snubs=g.snubbers||[];
      html+=`<div class="grid-season"><div class="grid-season-h">${esc(s)} <span class="ct">panel avg ${g.avg}</span></div>`;
      html+=`<div class="grid-cols${snubs.length?'':' single'}">`;
      html+=`<div class="grid-col"><div class="gc-lbl up">Boosted (${champs.length})</div>`;
      html+= champs.length? champs.map(c=>chip(c,'up')).join('') : `<span class="none">—</span>`;
      html+=`</div>`;
      // only show the snubbed column if there are snubbers (real-candidate seasons)
      if(snubs.length){
        html+=`<div class="grid-col"><div class="gc-lbl dn">Snubbed (${snubs.length})</div>`;
        html+= snubs.map(c=>chip(c,'dn')).join('');
        html+=`</div>`;
      }
      html+=`</div></div>`;
    });
    html+=`</div>`;
  });
  el.innerHTML=html || '<div class="hint">No notable season-level splits.</div>';
}
function chip(c,dir){
  const sign=c.diff>0?'+':'';
  const ol=c.outlet?` <span class="chip-ol">${esc(c.outlet)}</span>`:'';
  return `<div class="grid-chip ${dir}"><a href="reporter.html?v=${c.slug}">${esc(c.voter)}</a>${ol}<b>${sign}${c.diff.toFixed(1)}</b></div>`;
}

function renderBoard(){
  // build board for selected award using per-voter by_award diffs
  let board;
  if(curAward==='ALL'){
    board=DATA.board.map(b=>({voter:b.voter,slug:b.slug,diff:b.diff,n:b.n,outlet:b.outlet}));
  } else {
    board=DATA.board
      .filter(b=>b.by_award && b.by_award[curAward])
      .map(b=>({voter:b.voter,slug:b.slug,diff:b.by_award[curAward].diff,n:b.by_award[curAward].n,outlet:b.outlet}))
      .sort((a,b)=>b.diff-a.diff);
  }
  const N=15;
  const pos=board.filter(b=>b.diff>0);
  const neg=board.filter(b=>b.diff<0).reverse();
  let show = expanded? board : pos.slice(0,N).concat(neg.slice(0,N).reverse());
  const maxAbs=Math.max(1,...board.map(b=>Math.abs(b.diff)));
  const el=document.getElementById('board');
  el.innerHTML=show.map(b=>{
    const pct=Math.abs(b.diff)/maxAbs*100;
    const bar=b.diff>=0?`<div class="bar pos" style="width:${pct/2}%"></div>`:`<div class="bar neg" style="width:${pct/2}%"></div>`;
    const cls=b.diff>=0?'pos':'neg';
    const sign=b.diff>=0?'+':'';
    const perB=b.n?(b.diff/b.n):0;
    const outlet=b.outlet?`<span class="ol"><a href="outlet.html?o=${encodeURIComponent(outletSlug(b.outlet))}">${esc(b.outlet)}</a></span>`:'';
    return `<div class="row">
      <div class="pl"><a href="reporter.html?v=${b.slug}">${esc(b.voter)}</a>${outlet}</div>
      <div class="barwrap">${bar}</div>
      <div class="val ${cls}">${sign}${b.diff.toFixed(1)}<span class="sub">${sign}${perB.toFixed(1)}/b · ${b.n}b</span></div>
    </div>`;
  }).join('');
  const sm=document.getElementById('showmore');
  if(board.length>2*N){sm.style.display='block';sm.textContent=expanded?'Show less':`Show all ${board.length} voters`;sm.onclick=()=>{expanded=!expanded;renderBoard();};}
  else sm.style.display='none';
}

load();
</script>
</body>
</html>
